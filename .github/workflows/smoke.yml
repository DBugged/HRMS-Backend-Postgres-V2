# Runs the all-roles API smoke test every morning and on demand, and can be called before a deploy (workflow_call).
# Set the repository secrets SMOKE_BASE_URL (the API to check) and SMOKE_PASSWORD (the demo/test accounts' password).
name: Smoke test
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  workflow_call:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/smoke.mjs
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
